name: Synthetic factory handoff

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: apps/factory

env:
  FIXTURES: tests/fixtures/docs-link

jobs:
  propose:
    if: github.run_attempt == '1' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Produce candidate
        run: |
          jq --arg revision "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" \
            '.baseRevision = $revision | .runId = $run' "$FIXTURES/request.json" > request.json
          cargo build --locked --bin factory
          target/debug/factory prepare --request request.json --base "$FIXTURES/base" --out prepared
          target/debug/factory propose --run-spec prepared/run.json --base "$FIXTURES/base" --out candidate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: candidate
        with:
          name: synthetic-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/factory/candidate.json
          if-no-files-found: error
          retention-days: 7

  verify:
    if: github.run_attempt == '1'
    needs: propose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.propose.outputs.candidate_id }}
          digest-mismatch: error
          path: apps/factory/incoming
      - name: Verify candidate and check fixture denials
        run: |
          jq --arg revision "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" \
            '.baseRevision = $revision | .runId = $run' "$FIXTURES/request.json" > request.json
          cargo build --locked --bin factory
          target/debug/factory replay --suite "$FIXTURES" --out replay
          target/debug/factory prepare --request request.json --base "$FIXTURES/base" --out prepared
          target/debug/factory verify --run-spec prepared/run.json --base "$FIXTURES/base" \
            --candidate incoming/candidate.json --out verified
          git -C "$GITHUB_WORKSPACE" apply --check --directory="apps/factory/$FIXTURES/base" apps/factory/verified/review.patch
          digest=$(sha256sum verified/review.patch | cut -d ' ' -f1)
          intent=$(jq -er '.intentDigest' prepared/run.json)
          jq -e --arg revision "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" --arg digest "$digest" --arg intent "$intent" \
            '.status == "ready" and .baseRevision == $revision and .runId == $run and .attempt == 1 and .patchSha256 == $digest and .intentDigest == $intent' \
            verified/receipt.json > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/factory/verified/receipt.json
            apps/factory/verified/review.patch
            apps/factory/replay/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Write run summary
        run: |
          {
            echo '### Verified synthetic link repair'
            echo 'The exact approved repair passed. The wrong destination and unrelated edit fixtures were rejected.'
            echo 'Review the evidence artifact only if this run completed successfully. This patch is for the synthetic fixture only.'
          } >> "$GITHUB_STEP_SUMMARY"
